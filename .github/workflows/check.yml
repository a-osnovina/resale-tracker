name: Check app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get my files
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check manifest.json is valid
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: Check logic.js has no typos
        run: node --check logic.js

      - name: Check the app's JavaScript has no typos
        run: |
          node -e "
          const html = require('fs').readFileSync('index.html', 'utf8');
          const found = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (found.length === 0) throw new Error('No script found in index.html');
          found.forEach((m, i) => require('fs').writeFileSync('part' + i + '.js', m[1]));
          "
          for f in part*.js; do node --check "$f"; done

      - name: Run the money and date tests
        run: node tests/logic.test.js

      - name: Run the Profit tab tests
        run: node tests/profit.test.js
